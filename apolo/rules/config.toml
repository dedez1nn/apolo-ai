# Regras do Apolo — editável à mão.
#
# A cascata avalia de cima pra baixo e a PRIMEIRA regra que casar decide:
#   1. allowlist          -> manter (passa sempre, nunca é tocado)
#   2. blocklist          -> lixeira (ruído conhecido)
#   3. List-Unsubscribe   -> conforme [unsubscribe].acao (newsletter/marketing)
#   4. keywords           -> conforme cada grupo
#   5. (IA — passo 4, ainda não)
#   6. default            -> revisar (sem confiança, vai pra fila)
#
# Lembrete: no passo 2 tudo é SUGESTÃO. Nada é apagado automaticamente; o que
# casa "lixeira" entra na fila de revisão com a ação sugerida. A execução
# automática só chega quando uma regra for promovida (passo 6).
#
# "Adicionar uma fonte" = adicionar uma linha aqui. Domínio casa subdomínio
# (ex.: "loja-exemplo.com.br" pega "promo.loja-exemplo.com.br").

[allowlist]
remetentes = [
  # "chefe@empresa.com",
]
dominios = [
  # "banco-exemplo.com.br",
  # "orgao-exemplo.gov.br",
]

[blocklist]
remetentes = [
]
dominios = [
  # "promo.loja-exemplo.com.br",
]

[unsubscribe]
# O header List-Unsubscribe marca "email em massa" — mas bulk importante (banco,
# recibo, GitHub) também o tem. Por isso ele SOZINHO não decide: só vira `acao`
# se, além do header, casar um dos termos abaixo (2 sinais). Sem 2º sinal, o
# email segue a cascata e acaba em 'revisar'. exige = [] volta ao header-sozinho.
ativo = true
acao = "revisar"   # "lixeira" ou "revisar"
exige = ["oferta", "promoção", "promocao", "desconto", "off", "cupom",
         "black friday", "newsletter", "novidades", "sale", "deal"]

# Grupos de palavra-chave (substring, sem diferenciar maiúsculas/acento opcional).
# campo: "assunto" | "remetente" | "ambos"
# acao:  "lixeira" | "revisar" | "manter"

[[keywords]]
nome = "alerta_login"
campo = "assunto"
acao = "manter"
padroes = [
  # inglês
  "logged in", "log in", "signed in", "sign-in", "sign in attempt",
  "login attempt", "new device", "new sign-in", "suspicious login",
  "security alert", "verify your identity", "password changed",
  "password reset", "two-step", "two-factor", "2fa",
  # português
  "login realizado", "novo login", "tentativa de login", "tentativa de acesso",
  "novo acesso", "acesso não reconhecido", "acesso nao reconhecido",
  "dispositivo desconhecido", "alerta de segurança", "alerta de seguranca",
  "senha alterada", "verificação de segurança", "verificacao de seguranca",
]

# Emails cujo conteúdo inteiro é um código de uso único (login/verificação/
# confirmação). Diferente de "alerta_login": aqui o email não tem mais valor
# nenhum depois que o código foi usado — por isso, se já chegar marcado como
# lido (\Seen no IMAP / sem o label UNREAD no Gmail), o sync manda direto pra
# lixeira em vez de "manter" (ver rules.engine.descartar_codigo_lido).
[[keywords]]
nome = "codigo_verificacao"
campo = "assunto"
acao = "manter"
padroes = [
  # inglês
  "verification code", "security code", "confirmation code",
  "authentication code", "auth code", "login code", "access code",
  "one-time code", "one time code", "one-time password", "single-use code",
  "temporary code", "your code is", "your verification code", "otp",
  "passcode",
  # português
  "código de verificação", "codigo de verificacao",
  "código de segurança", "codigo de seguranca",
  "código de confirmação", "codigo de confirmacao",
  "código de acesso", "codigo de acesso",
  "código de login", "codigo de login",
  "código temporário", "codigo temporario",
]

[[keywords]]
nome = "promo"
campo = "ambos"
acao = "lixeira"
padroes = ["promoção", "promocao", "oferta", "desconto", "off", "black friday", "cupom"]

[[keywords]]
nome = "newsletter"
campo = "assunto"
acao = "revisar"
padroes = ["newsletter", "novidades", "resumo da semana"]

# Camada 2 — só roda quando o Ollama sugeriu "lixeira" (rede de segurança
# contra o modelo pequeno subestimar algo sensível). Soma o peso dos termos que
# baterem no assunto/remetente/trecho; se passar do "limiar" da categoria,
# rebaixa a sugestão pra "revisar" (nunca promove direto pra "manter"). Termos
# em termos_pt/termos_en só entram se o idioma do email foi identificado como
# tal; termos_ambos (loanwords, nomes próprios, domínios) sempre entram. Pesos
# e limiares abaixo são um primeiro palpite — ajuste olhando casos reais.

[verify.seguranca]
limiar = 5

[verify.seguranca.termos_ambos]
login = 2
password = 2
2fa = 2
otp = 3

[verify.seguranca.termos_pt]
